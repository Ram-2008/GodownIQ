<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16264A"/>
      <stop offset="100%" stop-color="#22385F"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2A93B"/>
      <stop offset="100%" stop-color="#E0901F"/>
    </linearGradient>
  </defs>

  <!-- Badge background -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- Warehouse body -->
  <rect x="146" y="266" width="220" height="140" rx="10" fill="#F4F1EA"/>

  <!-- Warehouse roof (gable) -->
  <polygon points="256,150 384,266 128,266" fill="url(#roofGrad)"/>

  <!-- Roof ridge highlight -->
  <polygon points="256,150 384,266 366,266 256,172" fill="#FFFFFF" opacity="0.15"/>

  <!-- Door -->
  <rect x="234" y="322" width="44" height="84" rx="4" fill="#22385F"/>

  <!-- Loading bay lines (warehouse detail) -->
  <rect x="166" y="292" width="36" height="10" rx="3" fill="#22385F" opacity="0.4"/>
  <rect x="310" y="292" width="36" height="10" rx="3" fill="#22385F" opacity="0.4"/>

  <!-- AI signal node, top right of roof -->
  <circle cx="374" cy="176" r="15" fill="#F2A93B"/>
  <circle cx="374" cy="176" r="27" fill="none" stroke="#F2A93B" stroke-width="4" opacity="0.55"/>
  <circle cx="374" cy="176" r="39" fill="none" stroke="#F2A93B" stroke-width="3" opacity="0.3"/>
</svg>
